# Done to increase the memory available to gradle.
# 通过 JVM 参数再设一遍 nonProxyHosts，避免 IDEA Sync 等场景下未继承 systemProp 的握手问题。
# preferIPv4Stack：部分网络下 IPv6 路径会导致 TLS 握手异常；https.nonProxyHosts：部分 HTTP 客户端单独读取。
org.gradle.jvmargs=-Xmx1G -Djava.net.preferIPv4Stack=true -Dhttp.nonProxyHosts=localhost|127.0.0.1|*.fabricmc.net|maven.fabricmc.net|*.minecraft.net|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|resources.download.minecraft.net|services.gradle.org|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com|*.maven.aliyun.com|*.blob.core.windows.net -Dhttps.nonProxyHosts=localhost|127.0.0.1|*.fabricmc.net|maven.fabricmc.net|*.minecraft.net|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|resources.download.minecraft.net|services.gradle.org|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com|*.maven.aliyun.com|*.blob.core.windows.net
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.18.6
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=name.modid

# Dependencies
fabric_api_version=0.145.4+26.1.2

#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=7890
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=7890

# 本地代理对部分站点（如 Cloudflare 前的 maven.fabricmc.net）可能导致 TLS 握手失败；
# 以下主机走直连，其余仍走代理。（含 *.minecraft.net / Azure blob，避免 Mojang 库实际回源域名仍走代理。）
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.fabricmc.net|maven.fabricmc.net|*.minecraft.net|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|resources.download.minecraft.net|services.gradle.org|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com|*.maven.aliyun.com|*.blob.core.windows.net
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.fabricmc.net|maven.fabricmc.net|*.minecraft.net|libraries.minecraft.net|launchermeta.mojang.com|piston-data.mojang.com|resources.download.minecraft.net|services.gradle.org|repo.maven.apache.org|repo1.maven.org|maven.aliyun.com|*.maven.aliyun.com|*.blob.core.windows.net

#org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-26.jdk/Contents/Home