# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: Configure Gradle properties
        run: |
          echo "systemProp.https.protocols=TLSv1.2,TLSv1.3" >> gradle.properties
          echo "systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3" >> gradle.properties
          # 可选：配置代理（如果使用代理的话，一般不需要）
            
          # 使用 Gradle Wrapper 并添加镜像仓库（需要同时修改 build.gradle）
      - name: Build with Gradle
        run: |
          # 如果 build.gradle 中已配置阿里云镜像，这步会自动使用
          ./gradlew build --no-daemon --stacktrace
